<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get-it</title>
<link rel="stylesheet" href="{{{{ url_for('static', filename='css/getit.css') }}}}">
</head>
<body>

<header class="header">
  <img class="logo" src="{{{{ url_for('static', filename='img/logo-getit.png') }}}}" alt="Get-it">
  <p class="tagline">Como o Post-it, mas com outro verbo</p>
</header>

<main class="container">

  <form class="note-form" action="/submit" method="POST">
    <h2>Nova anotação</h2>
    <label for="titulo">Título</label>
    <input id="titulo" type="text" name="titulo" placeholder="Receita de miojo" />
    <label for="detalhes">Detalhes</label>
    <input id="detalhes" type="text" name="detalhes" placeholder="Bata com um martelo antes de abrir o pacote." />
    <input type="submit" value="Adicionar" />
  </form>

  <ul class="notes">
{notes}
  </ul>

</main>

</body>
</html>
